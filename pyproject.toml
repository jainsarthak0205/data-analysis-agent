[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-analysis-agent"
version = "0.1.0"
description = "Agentic pandas analyst over the Palmer Penguins dataset, powered by Claude Opus 4.8 tool use."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sarthak Jain" }]
keywords = ["agent", "llm", "anthropic", "claude", "pandas", "data-analysis", "tool-use", "fastapi"]
dependencies = [
    "anthropic>=0.40",
    "pandas>=2.0",
    "numpy>=1.24",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]

[project.scripts]
data-analysis-agent = "data_analysis_agent.cli:main"

[tool.setuptools.packages.find]
include = ["data_analysis_agent*"]
exclude = ["tests*", "scripts*"]

[tool.setuptools.package-data]
"data_analysis_agent.data" = ["*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
